
# Private weekly summary draft. Save this in the PUBLIC site repository as:  .github/workflows/weekly.yml
#
# Every Sunday morning it sends YOU a draft summary of the past seven days on Telegram, for you to edit and post on Substack.
# Nothing is ever posted publicly. Needs the same secrets as the alerts: CODE_TOKEN, TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID.
name: Weekly summary draft

on:
  schedule:
    - cron: "0 7 * * 0"           # Sunday 07:00 UTC: 07:00 UK time in winter, 08:00 in summer
  workflow_dispatch:

permissions:
  contents: read

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch the private code
        uses: actions/checkout@v4
        with:
          repository: slyardley/sun-products
          token: ${{ secrets.CODE_TOKEN }}
          path: code
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install requests

      - name: Build and send the draft
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python code/space_alerts.py --weekly
